services:
  rimun:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4210:4210"
    environment:
      RIMUN_ADMIN_TOKEN: ${RIMUN_ADMIN_TOKEN:?set RIMUN_ADMIN_TOKEN}
      RIMUN_REGISTRATION_KEY: ${RIMUN_REGISTRATION_KEY:?set RIMUN_REGISTRATION_KEY}
    volumes:
      - rimun-data:/app/data
volumes:
  rimun-data: